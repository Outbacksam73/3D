<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Modular Clock Wheel Visualizer | Outback Sams</title>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: rgba(22, 27, 34, 0.85);
      --border: #30363d;
      --accent: #58a6ff;
      --gold: #d29922;
      --green: #238636;
      --text: #c9d1d9;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background-color: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }

    /* Floating UI Overlay */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(13,17,23,0.9) 0%, rgba(13,17,23,0) 100%);
      pointer-events: none;
    }

    .top-nav a, .top-nav span { pointer-events: auto; }

    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .nav-link:hover { text-decoration: underline; }

    .free-badge {
      background-color: var(--green);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    /* Floating Control Card */
    .controls-card {
      position: absolute;
      top: 70px;
      left: 20px;
      width: 320px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      z-index: 10;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
    }

    h1 { font-size: 1.3rem; color: #fff; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; }

    .control-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
    input[type="range"] { width: 100%; cursor: pointer; }
    .val-disp { color: var(--accent); font-weight: bold; float: right; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    button {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    button:hover { background: #3c444d; color: #fff; }
    button.active { background: var(--accent); color: #000; }

    .instructions {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 10;
      pointer-events: none;
    }

    #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="https://outbacksams.com" class="nav-link">&larr; Back to OutbackSams.com</a>
    <span class="free-badge">3D Free Visualizer</span>
  </nav>

  <div class="controls-card">
    <h1>3D Clock Wheel</h1>
    <p class="subtitle">Rotate, zoom & explore modular 3D math webs</p>

    <div class="control-group">
      <label>Modulus Points (N): <span class="val-disp" id="nVal">24</span></label>
      <input type="range" id="nInput" min="5" max="180" value="24" oninput="updateWheel()" />
    </div>

    <div class="control-group">
      <label>Multiplier Step (M): <span class="val-disp" id="mVal">2</span></label>
      <input type="range" id="mInput" min="2" max="50" value="2" oninput="updateWheel()" />
    </div>

    <div class="control-group">
      <label>3D Z-Depth (Wave Height): <span class="val-disp" id="zVal">0</span></label>
      <input type="range" id="zInput" min="0" max="100" value="0" oninput="updateWheel()" />
    </div>

    <div class="control-group">
      <label>Filter Overlay</label>
      <div class="btn-grid">
        <button id="primeBtn" onclick="togglePrimeHighlight()">Primes Only</button>
        <button id="drBtn" onclick="toggleDRHighlight()">Digital Roots</button>
      </div>
    </div>

    <div class="control-group">
      <label>Preset Patterns</label>
      <div class="btn-grid">
        <button onclick="setPreset(12, 2, 0)">Mod 12 Flat</button>
        <button onclick="setPreset(24, 5, 30)">24-Star 3D</button>
        <button onclick="setPreset(90, 3, 50)">90-Web 3D</button>
        <button onclick="setPreset(120, 7, 75)">120-Cardioid</button>
      </div>
    </div>

    <div class="control-group">
      <button id="rotBtn" style="width:100%; margin-top:6px;" onclick="toggleAutoRotate()">Auto-Rotate: ON</button>
    </div>
  </div>

  <div class="instructions">🖱️ Left Click + Drag to rotate | Scroll to zoom</div>

  <div id="webgl-container"></div>

  <script>
    let scene, camera, renderer, controls;
    let webGroup, nodeGroup, ringMesh;
    let showPrimes = false;
    let showDR = false;
    let autoRotate = true;

    function isPrime(num) {
      if (num <= 1) return false;
      if (num <= 3) return true;
      if (num % 2 === 0 || num % 3 === 0) return false;
      for (let i = 5; i * i <= num; i += 6) {
        if (num % i === 0 || num % (i + 2) === 0) return false;
      }
      return true;
    }

    function getDigitalRoot(n) {
      if (n === 0) return 0;
      return 1 + ((n - 1) % 9);
    }

    function init() {
      const container = document.getElementById('webgl-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1117);

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, -250, 300);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x58a6ff, 1.5, 1000);
      pointLight.position.set(0, 0, 300);
      scene.add(pointLight);

      // Groups
      webGroup = new THREE.Group();
      nodeGroup = new THREE.Group();
      scene.add(webGroup);
      scene.add(nodeGroup);

      // Base Perimeter Ring
      const ringGeo = new THREE.TorusGeometry(150, 1, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x30363d });
      ringMesh = new THREE.Mesh(ringGeo, ringMat);
      scene.add(ringMesh);

      window.addEventListener('resize', onWindowResize);

      updateWheel();
      animate();
    }

    function updateWheel() {
      const N = parseInt(document.getElementById('nInput').value);
      const M = parseInt(document.getElementById('mInput').value);
      const ZDepth = parseInt(document.getElementById('zInput').value);

      document.getElementById('nVal').innerText = N;
      document.getElementById('mVal').innerText = M;
      document.getElementById('zVal').innerText = ZDepth;

      // Clear existing geometry
      while(webGroup.children.length > 0) webGroup.remove(webGroup.children[0]);
      while(nodeGroup.children.length > 0) nodeGroup.remove(nodeGroup.children[0]);

      const radius = 150;
      let points = [];

      // Compute 3D Points around the ring
      for (let i = 0; i < N; i++) {
        let angle = (i * 2 * Math.PI / N) - (Math.PI / 2);
        let x = radius * Math.cos(angle);
        let y = radius * Math.sin(angle);
        // Optional 3D Z-displacement based on digital root or sequence
        let z = ZDepth > 0 ? Math.sin((i / N) * Math.PI * 4) * ZDepth : 0;
        points.push(new THREE.Vector3(x, y, z));
      }

      // Render 3D Line Webs
      const linePositions = [];
      for (let i = 0; i < N; i++) {
        let target = (i * M) % N;
        linePositions.push(points[i].x, points[i].y, points[i].z);
        linePositions.push(points[target].x, points[target].y, points[target].z);
      }

      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      const lineMat = new THREE.LineBasicMaterial({
        color: 0x58a6ff,
        transparent: true,
        opacity: 0.4
      });

      const lineSegments = new THREE.LineSegments(lineGeo, lineMat);
      webGroup.add(lineSegments);

      // Render 3D Node Spheres
      const sphereGeo = new THREE.SphereGeometry(N > 60 ? 2 : 3.5, 16, 16);

      points.forEach((p, idx) => {
        let colorHex = 0x8b949e;

        if (showPrimes && isPrime(idx)) {
          colorHex = 0xd29922; // Gold for Primes
        } else if (showDR) {
          let dr = getDigitalRoot(idx);
          if (dr === 3 || dr === 6 || dr === 9) colorHex = 0xf85149; // Red for 3-6-9
          else colorHex = 0x58a6ff;
        }

        const sphereMat = new THREE.MeshStandardMaterial({
          color: colorHex,
          roughness: 0.3,
          metalness: 0.8
        });

        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.copy(p);
        nodeGroup.add(sphere);
      });
    }

    function togglePrimeHighlight() {
      showPrimes = !showPrimes;
      document.getElementById('primeBtn').classList.toggle('active', showPrimes);
      updateWheel();
    }

    function toggleDRHighlight() {
      showDR = !showDR;
      document.getElementById('drBtn').classList.toggle('active', showDR);
      updateWheel();
    }

    function toggleAutoRotate() {
      autoRotate = !autoRotate;
      document.getElementById('rotBtn').innerText = `Auto-Rotate: ${autoRotate ? 'ON' : 'OFF'}`;
    }

    function setPreset(n, m, z) {
      document.getElementById('nInput').value = n;
      document.getElementById('mInput').value = m;
      document.getElementById('zInput').value = z;
      updateWheel();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate) {
        webGroup.rotation.z += 0.002;
        nodeGroup.rotation.z += 0.002;
        ringMesh.rotation.z += 0.002;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
